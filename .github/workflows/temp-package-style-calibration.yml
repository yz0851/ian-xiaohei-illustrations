name: Temporary package style calibration images

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/add-style-calibration-images

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package calibration assets
        run: |
          cd kunetic-product-visual-prompts/assets
          zip -r style-calibration.zip style-calibration
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: style-calibration-review
          path: kunetic-product-visual-prompts/assets/style-calibration.zip
          retention-days: 1
